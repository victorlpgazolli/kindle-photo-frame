description "Kindle Photo Frame Watcher"

start on framework_ready
stop on stopping framework

respawn
respawn limit 10 60

script
    while [ ! -f /mnt/us/watch.py ]; do
        sleep 2
    done

    # Impede o kernel de suspender a CPU e o Wi-Fi durante o screensaver
    if [ -f /sys/power/wake_lock ]; then
        echo "kindle_photoframe" > /sys/power/wake_lock
    fi

    export PATH="/mnt/us/python3/bin:/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"

    exec python3 /mnt/us/watch.py >> /tmp/watch.log 2>&1
end script

post-stop script
    # Libera o wakelock caso você pare o serviço manualmente
    if [ -f /sys/power/wake_unlock ]; then
        echo "kindle_photoframe" > /sys/power/wake_unlock
    fi
end script
