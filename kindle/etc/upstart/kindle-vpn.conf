start on started filesystems_userstore and started wifid
stop on stopping wifid

respawn
respawn limit 10 30

script
  export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  while [ ! -f /mnt/us/documents/start_wg.sh ] || ! ip addr show wlan0 | grep -q "inet "; do
    sleep 2
  done
  exec >> /var/tmp/cloudflared.log 2>&1
  echo "=== Iniciando kindle-vpn em $(date) ==="
  sh /mnt/us/documents/start_wg.sh
  cp /mnt/us/projects/cloudflared/cloudflared /var/tmp/cloudflared-bin
  chmod +x /var/tmp/cloudflared-bin
  TOKEN="$(cat /mnt/us/projects/cloudflared/token.txt)"
  exec /var/tmp/cloudflared-bin tunnel --no-autoupdate run --token "$TOKEN"
end script
